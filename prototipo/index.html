<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo Vera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de duas colunas, navegação com ícones à esquerda e área de trabalho à direita; tema claro com base rosa; no celular a navegação vira faixa rolável no topo */
:root{
  color-scheme:light;
  --bg:#fbf5f8; --surface:#ffffff; --surface-2:#f7ecf1; --ink:#2a1822; --ink-2:#7b6270; --line:#f0dce6;
  --accent:#e0407b; --accent-strong:#bf2a62; --accent-ink:#ffffff; --accent-soft:#fde3ee; --accent-tint:#fff0f6;
  --good:#1b8f63; --good-soft:#dbf2e7; --warn:#c2620d; --warn-soft:#fdead6; --bad:#c32d3a; --bad-soft:#fbdfe2;
  --c-rf_pos:#5868d6; --c-rf_pre:#8b78e3; --c-rf_ipca:#b45bd0; --c-acoes_br:#e0407b; --c-fii:#ef8657; --c-acoes_eua:#22968a; --c-reits:#e6a92c; --c-cripto:#6d3a5f;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  --shadow:0 1px 2px rgba(120,30,70,.06),0 6px 20px rgba(120,30,70,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
a{color:var(--accent-strong);font-weight:600}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(224,64,123,.35)}
.brand b{font-family:var(--f-display);font-size:25px;font-weight:700;letter-spacing:-.045em;line-height:.9}
.brand b::after{content:".";color:var(--accent)}
.brand small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.navgroup{display:flex;flex-direction:column;gap:3px}
.navgroup h6{margin:0 0 6px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:500;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.nav .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.nav:hover{background:var(--accent-tint)}
.nav[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.nav[aria-current="page"] .ico{background:var(--accent);color:#fff}
.nav .count{margin-left:auto;font-size:11px;background:var(--warn);color:#fff;border-radius:99px;padding:0 7px;font-weight:700}
.proto{margin-top:auto;font-size:12px;color:var(--ink-2);padding:12px;border-radius:12px;background:var(--accent-tint);display:flex;gap:8px}
.proto svg{color:var(--accent);margin-top:2px}
.main{min-width:0;padding-block:26px 60px;padding-inline:clamp(16px,3.5vw,44px)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:22px}
.head h1{font-family:var(--f-display);font-size:clamp(26px,3.2vw,34px);letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance;display:flex;align-items:center;gap:12px}
.head h1 .hico{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.head h1 .hico svg{width:22px;height:22px}
.head p{margin:8px 0 0;color:var(--ink-2);max-width:64ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-strong);box-shadow:0 1px 3px rgba(120,30,70,.15)}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-family:var(--f-display);font-size:18px;margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h2 svg{color:var(--accent)}
.card h2 + p{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.herocard{background:linear-gradient(140deg,var(--accent-soft) 0%,var(--surface) 62%);position:relative;overflow:hidden}
.herocard .deco{position:absolute;right:-24px;top:-24px;width:150px;height:150px;color:var(--accent);opacity:.12}
.herocard .deco svg{width:100%;height:100%;stroke-width:1.4}
.big{font-family:var(--f-display);font-size:clamp(32px,4.6vw,46px);letter-spacing:-.03em;line-height:1;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:700;display:flex;align-items:center;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px}
.pill svg{color:var(--accent)}
.pill b{font-weight:700}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--accent)}
.callout svg{color:var(--accent)}
.stackwrap{display:grid;gap:12px}
.stackrow{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.stack{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%;border-right:2px solid var(--surface);cursor:pointer;transition:filter .15s}
.stack span:hover,.stack span.hl{filter:brightness(1.12) saturate(1.1)}
.stack.meta span{opacity:.5}
.stack.meta span:hover{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hint{font-size:12px;color:var(--ink-2);margin-top:10px;display:flex;align-items:center;gap:6px}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-tint)}
.tile{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;flex:none}
.tile svg{width:17px;height:17px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.cname{font-weight:600}
.sub{display:block;font-size:12px;color:var(--ink-2);font-weight:400}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gauge{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:120px;cursor:pointer}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.gauge .tgt{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.up{background:var(--warn-soft);color:var(--warn)}
.chip.down{background:var(--accent-soft);color:var(--accent-strong)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:var(--surface-2);color:var(--ink-2);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--accent-tint);border-color:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(224,64,123,.28)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--bad-soft);color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.num{text-align:right}
.input.tiny{width:76px;padding:5px 8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.searchbox .input{padding-left:38px;font-size:15px;padding-block:11px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;color:var(--accent-strong)}
.stepper button:hover{background:var(--accent-tint)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.note > svg{color:var(--accent);margin-top:2px}
.note b{color:var(--ink)}
.back{border:0;background:none;color:var(--accent-strong);font-weight:700;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.kpi .tile{grid-row:span 2}
.kpi .v{font-family:var(--f-display);font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.focus{background:linear-gradient(140deg,var(--accent-soft),var(--surface) 75%);border-color:var(--accent)}
.hbar{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) 110px;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.hbar:last-child{border-bottom:0}
.hbar .track{height:12px;background:var(--surface-2);border-radius:6px;position:relative;cursor:pointer}
.hbar .track span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#b9a3af}
.hbar .track span.flex{background:var(--accent)}
.hbar .track span.unc{background:var(--warn)}
.hbar .track i{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.tog{border:0;background:var(--surface-2);color:var(--ink-2);font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 8px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.tog.on{background:var(--accent-soft);color:var(--accent-strong)}
.tx{display:grid;grid-template-columns:36px 54px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .d{font-size:12.5px;color:var(--ink-2)}
.tx .m{font-weight:600;overflow-wrap:anywhere}
.tx.unc{background:linear-gradient(90deg,var(--warn-soft),transparent 75%);margin:0 -12px;padding-inline:12px;border-radius:12px}
.fix{grid-column:3 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px}
.howto{display:grid;gap:0;margin:0;padding:0;list-style:none;counter-reset:s}
.howto > li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.howto > li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;position:relative;z-index:1}
.howto > li:not(:last-child)::after{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--accent-soft)}
.howto > li.done::before{content:"✓";background:var(--good)}
.howto h4{margin:6px 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.howto ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px;display:grid;gap:4px}
.howto .url{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:8px;padding:3px 9px;text-decoration:none;color:var(--accent-strong);font-weight:500}
.howto .url:hover{background:var(--accent-soft)}
.kbd{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.warnbox b{color:var(--ink)}
.conn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.bank{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.modal{position:fixed;inset:0;background:rgba(60,15,38,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:20px;width:min(980px,100%);height:min(720px,calc(100% - 32px));display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 30px 80px rgba(60,15,38,.3);overflow:hidden}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-family:var(--f-display);margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.sheet-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);min-height:0}
.sheet-left{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.sheet-right{padding:18px 22px;overflow:auto;background:var(--accent-tint);border-left:1px solid var(--line)}
.sheet-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.results{display:grid;gap:6px}
.result{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.result:hover{border-color:var(--accent-soft);background:var(--accent-tint)}
.result[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.preview{display:grid;gap:14px}
.preview .ptitle{display:flex;align-items:center;gap:12px}
.preview .ptitle .tile{width:46px;height:46px;border-radius:14px}
.preview .ptitle .tile svg{width:22px;height:22px}
.preview .ptitle b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1}
.pvalue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.pvalue .big{font-size:30px;margin:4px 0 2px}
.empty{display:grid;place-items:center;text-align:center;height:100%;color:var(--ink-2);gap:10px;padding:30px}
.empty svg{width:44px;height:44px;color:var(--accent);opacity:.5;stroke-width:1.5}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:30;box-shadow:0 10px 24px rgba(60,15,38,.3);display:flex;gap:8px;align-items:center}
.toast svg{color:#ff9cc2}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;min-width:190px;box-shadow:0 12px 28px rgba(60,15,38,.3)}
.tip .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tip .t i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip .l{display:flex;justify-content:space-between;gap:16px;color:#e9d6df}
.tip .l b{color:#fff;font-family:var(--f-mono);font-weight:500}
.tip .s{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.15);font-weight:600}
.alloc{display:grid;gap:12px}
.allocclass{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.allocclass header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px}
.allocclass header .amt{margin-left:auto;font-family:var(--f-display);font-size:20px;color:var(--accent-strong)}
.allocasset{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;padding:9px 14px 9px 60px;border-top:1px solid var(--line);font-size:13.5px}
.onb{position:fixed;inset:0;z-index:15;background:radial-gradient(ellipse 80% 60% at 0% 0%,var(--accent-soft),transparent 70%),radial-gradient(ellipse 60% 50% at 100% 100%,#fff0e8,transparent 70%),var(--bg);overflow:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.onb-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:16px clamp(16px,4vw,40px)}
.onb-prog{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.onb-prog span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.onb-prog span b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:12px}
.onb-prog span.cur{color:var(--ink)}
.onb-prog span.cur b{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.onb-prog span.done b{background:var(--good);color:#fff;border-color:var(--good)}

const pct = (v, d = 1) => v.toFixed(d).replace('.', ',') + '%';
const pp = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',') + ' pp';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const valueBRL = p => (p.kind === 'rf' ? p.value : p.qty * p.price) * (p.cur === 'USD' ? FX : 1);

function classRows() {
  const total = positions.reduce((s, p) => s + valueBRL(p), 0);
  return {total, rows: CLASSES.map(c => {
    const value = positions.filter(p => p.cls === c.id).reduce((s, p) => s + valueBRL(p), 0);
    const share = total ? value / total * 100 : 0;
    const target = classTargets[c.id] || 0;
    return {cls:c.id, value, share, target, dev: share - target};
  })};
}

function assetGroups(cls) {
  const map = new Map();
  positions.filter(p => p.cls === cls).forEach(p => {
    const g = map.get(p.ticker) || {ticker:p.ticker, name:p.name, value:0, sample:p};
    g.value += valueBRL(p); map.set(p.ticker, g);
  });
  const groups = [...map.values()];
  const total = groups.reduce((s, g) => s + g.value, 0);
  const t = assetTargetsFor(cls, groups.map(g => g.ticker));
  groups.forEach(g => { g.share = total ? g.value / total * 100 : 0; g.target = t[g.ticker]; g.dev = g.share - g.target; });
  return {total, groups: groups.sort((a, b) => b.value - a.value)};
}

function assetTargetsFor(cls, tickers) {
  const out = {};
  if (assetTargets[cls]) { tickers.forEach(tk => { out[tk] = assetTargets[cls][tk] ?? 0; }); return out; }
  const each = tickers.length ? 100 / tickers.length : 0;
  tickers.forEach(tk => { out[tk] = Math.round(each * 10) / 10; });
  return out;
}

function status(dev, tol = state.tol) {
  if (Math.abs(dev) <= tol) return `<span class="chip ok">${ic('check')}na faixa</span>`;
  return dev > 0 ? `<span class="chip up">${pp(dev)} acima</span>` : `<span class="chip down">${pp(dev)} abaixo</span>`;
}

function gauge(share, target, color, tipAttrs) {
  const max = Math.max(share, target, 1) * 1.25;
  return `<div class="gauge" ${tipAttrs}><div class="fill" style="width:${share / max * 100}%;background:${color}"></div><div class="tgt" style="left:calc(${target / max * 100}% - 1px)"></div></div>`;
}

function allocate(amount, items) {
  const total = items.reduce((s, i) => s + i.current, 0) + amount;
  const needs = items.map(i => Math.max(0, i.target / 100 * total - i.current));
  const sumN = needs.reduce((a, b) => a + b, 0);
  const tp = items.reduce((s, i) => s + i.target, 0) || 1;
  if (sumN <= 0) return items.map(i => amount * i.target / tp);
  if (sumN >= amount) return needs.map(n => amount * n / sumN);
  return needs.map((n, k) => n + (amount - sumN) * items[k].target / tp);
}

screens.aporte = () => {
  const {total, rows} = classRows();
  const amount = Math.max(0, Number(state.aporte) || 0);
  const alloc = allocate(amount, rows.map(r => ({current:r.value, target:r.target})));
  const newTotal = total + amount;
  const blocks = rows.map((r, i) => ({r, a:alloc[i]})).filter(x => x.a >= 1).sort((a, b) => b.a - a.a);
  return `
  <div class="head"><div>${title('zap', 'Aporte inteligente')}<p>Diga quanto vai investir e veja onde colocar para aproximar a carteira da meta, sem vender nada (vender gera imposto).</p></div><div class="controls">${baseSeg()}</div></div>
  <section class="card herocard">
    <div class="deco">${ic('zap')}</div>
    <div class="row" style="align-items:flex-end;gap:16px">
      <div class="field" style="max-width:260px"><label for="aporte">Quanto você vai aportar (R$)</label><input class="input num" style="font-size:20px;font-family:var(--f-display)" id="aporte" type="number" min="0" step="500" value="${amount}" data-aporte></div>
      <div class="row">${[5000, 10000, 25000, 50000].map(v => `<button class="btn sm" data-aporte-quick="${v}">${brl.format(v)}</button>`).join('')}</div>
    </div>
  </section>
  <div class="alloc" style="margin-top:16px">
    ${amount <= 0 ? '<p class="muted">Informe um valor para ver a sugestão.</p>' : blocks.map(({r, a}) => {
      const after = (r.value + a) / newTotal * 100;
      const {groups} = assetGroups(r.cls);
      let assets = '';
      if (groups.length) {
        const sub = allocate(a, groups.map(g => ({current:g.value, target:g.target})));
        assets = groups.map((g, k) => ({g, v:sub[k]})).filter(x => x.v >= 1).sort((x, y) => y.v - x.v).map(({g, v}) => {
          const s = g.sample;
          const units = s.kind === 'rv' ? v / (s.cur === 'USD' ? FX : 1) / s.price : null;
          const unitTxt = units == null ? 'novo título ou reforço' : units >= 1 ? `≈ ${Math.floor(units).toLocaleString('pt-BR')} ${s.cls === 'cripto' ? 'un.' : 'cotas'}` : `≈ ${nf.format(units)} un.`;
          return `<div class="allocasset"><span><b>${esc(g.ticker)}</b> <span class="muted">${esc(g.name)}</span></span><span class="muted">${unitTxt}</span><span class="num">${money(v)}</span></div>`;
        }).join('');
      }
      return `<div class="allocclass"><header><span class="tile" style="${tint(r.cls)}">${ic(CLS[r.cls].icon)}</span><b>${CLS[r.cls].name}</b><span class="muted num">${pct(r.share)} → ${pct(after)} <span style="opacity:.7">(meta ${pct(r.target, 0)})</span></span><span class="amt num">${money(a)}</span></header>${assets}</div>`;
    }).join('')}
  </div>
  <p class="note" style="margin-top:14px">${ic('info')}<span>A conta: com o aporte, o patrimônio vai a ${money(newTotal)}. Cada classe abaixo da meta recebe a diferença até a meta; se o dinheiro não cobre tudo, ele é dividido proporcionalmente ao que falta. Dentro da classe, vale a mesma regra entre os ativos.</span></p>`;
};

function catTotals() {
  const t = {...CAT_BASE};
  let unc = 0;
  txs.forEach(x => { if (x.cat) t[x.cat] = (t[x.cat] || 0) + x.amt; else unc += x.amt; });
  return {t, unc};
}
function spendSummary() {
  const {t, unc} = catTotals();
  const spent = Object.values(t).reduce((a, b) => a + b, 0) + unc;
  const saved = INCOME - spent;
  return {t, unc, spent, saved, rate: saved / INCOME * 100};
}
const catTile = (c, unc) => `<span class="tile" style="background:${unc ? 'var(--warn-soft)' : c.flex ? 'var(--accent-soft)' : 'var(--surface-2)'};color:${unc ? 'var(--warn)' : c.flex ? 'var(--accent-strong)' : 'var(--ink-2)'}">${ic(unc ? 'help' : c.icon)}</span>`;

screens.cortes = () => {
  const {t, unc, saved, rate} = spendSummary();
  const goalAmt = INCOME * state.goal / 100;
  const gap = Math.max(0, goalAmt - saved);
  const flex = CATS.filter(c => c.flex && t[c.id] > 0).map(c => ({c, cur:t[c.id], excess:Math.max(0, t[c.id] - c.avg)}));
  const sumEx = flex.reduce((s, f) => s + f.excess, 0);
  const sumFlex = flex.reduce((s, f) => s + f.cur, 0);
  flex.forEach(f => {
    if (gap <= 0) f.cut = 0;
    else if (sumEx >= gap) f.cut = f.excess * gap / sumEx;
    else f.cut = Math.min(f.cur, f.excess + (gap - sumEx) * f.cur / (sumFlex || 1));
  });
  const totalCut = flex.reduce((s, f) => s + f.cut, 0);
  const impossible = gap > sumFlex;
  return `
  <div class="head"><div>${title('scissors', 'Onde cortar')}<p>A partir da sua meta de economia, o sistema calcula quanto falta e distribui o corte entre os gastos flexíveis que mais passaram da sua própria média.</p></div></div>
  <div class="two">
    <section class="card">
      <h2>${ic('target')}Sua meta</h2><p>Quanto da renda você quer guardar todo mês.</p>
      <div class="row"><input type="range" min="5" max="40" step="1" id="goal" data-goal value="${state.goal}" style="flex:1;accent-color:var(--accent)" aria-label="Meta de economia"><b class="num" style="font-size:22px;min-width:56px;text-align:right;color:var(--accent-strong)">${state.goal}%</b></div>
      <div class="pills" style="margin-top:14px"><span class="pill">${ic('target')}Meta <b class="num">${brl.format(goalAmt)}</b></span><span class="pill">${ic('piggy')}Guardado <b class="num">${brl.format(saved)}</b> (${pct(rate, 0)})</span></div>
    </section>
    <section class="card" style="background:${gap > 0 ? 'linear-gradient(140deg,var(--warn-soft),var(--surface) 70%)' : 'linear-gradient(140deg,var(--good-soft),var(--surface) 70%)'};border-color:${gap > 0 ? 'var(--warn)' : 'var(--good)'}">
      <div class="label">${ic(gap > 0 ? 'alert' : 'check')}${gap > 0 ? 'Falta por mês' : 'Meta atingida'}</div>
      <div class="big num" style="color:${gap > 0 ? 'var(--warn)' : 'var(--good)'}">${brl.format(gap > 0 ? gap : saved - goalAmt)}</div>
      <p class="muted" style="margin:0">${gap > 0 ? (impossible ? 'Mais do que todos os gastos flexíveis somados. Para essa meta, seria preciso rever algum gasto fixo ou a renda.' : `Dá pra chegar lá cortando ${brl.format(totalCut)} em ${flex.filter(f => f.cut >= 1).length} categorias flexíveis.`) : 'Você guardou mais do que a meta. Esse valor pode ir direto para o aporte inteligente.'}</p>
      ${gap <= 0 ? `<button class="btn sm primary" data-go="aporte" style="margin-top:12px">${ic('zap')}Ir para o aporte</button>` : ''}
    </section>
  </div>
  ${gap > 0 ? `<section class="card" style="margin-top:16px">
    <h2>${ic('scissors')}Sugestão de limites para outubro</h2><p>Começa pelo que subiu acima da sua média; só passa disso se ainda faltar.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Categoria</th><th class="r">Setembro</th><th class="r">Sua média</th><th class="r">Cortar</th><th class="r">Limite sugerido</th></tr></thead>
      <tbody>${flex.sort((a, b) => b.cut - a.cut).map(f => `<tr>
        <td><span class="who">${catTile(f.c)}<span class="cname">${f.c.name}</span></span></td><td class="r num">${brl.format(f.cur)}</td><td class="r num muted">${brl.format(f.c.avg)}</td>
        <td class="r num" style="color:${f.cut >= 1 ? 'var(--warn)' : 'var(--ink-2)'};font-weight:600">${f.cut >= 1 ? '−' + brl.format(f.cut) : '—'}</td>
        <td class="r num"><b>${brl.format(f.cur - f.cut)}</b></td></tr>`).join('')}</tbody>
    </table></div>
  </section>` : ''}
  ${unc > 0 ? `<p class="note" style="margin-top:14px">${ic('help')}<span><b>${brl.format(unc)} sem categoria</b> ficaram de fora da conta. <button class="btn sm" data-go="transacoes" style="margin-left:6px">Categorizar</button></span></p>` : ''}`;
};

function rfCalc(f) {
  const years = Math.max(0, (new Date('2026-10-09T12:00:00') - new Date(f.date + 'T12:00:00')) / (365.25 * 864e5));
  const yr = f.idx === 'cdi' ? CDI * f.rate / 100 : f.idx === 'pre' ? f.rate / 100 : (1.045 * (1 + f.rate / 100) - 1);
  const value = f.applied * Math.pow(1 + yr, years);
  const cls = f.idx === 'cdi' ? 'rf_pos' : f.idx === 'pre' ? 'rf_pre' : 'rf_ipca';
  const label = f.idx === 'cdi' ? `${f.rate}% do CDI` : f.idx === 'pre' ? `pré ${f.rate}% a.a.` : `IPCA + ${f.rate}%`;
  const src = f.idx === 'ipca' ? 'IPCA + taxa (BC)' : f.idx === 'pre' ? 'Taxa contratada' : 'Curva do CDI (BC)';
  return {value, cls, label, src, years, yr};
}

  {id:'acoes_br', name:'Ações brasileiras', d:'ações e ETFs da B3', icon:'bars', cls:'acoes_br'},
  {id:'fii', name:'Fundos imobiliários', d:'FIIs da B3', icon:'building', cls:'fii'},
  {id:'acoes_eua', name:'Ações americanas', d:'ações, ETFs e BDRs', icon:'globe', cls:'acoes_eua'},

const typeOfCatalog = a => a.type === 'Tesouro' ? 'tesouro' : a.cls;

    const c = m.pickCls || p.cls;
    const v = qty * p.price * (p.cur === 'USD' ? FX : 1);

        <div class="field"><label for="add-cls">Classe</label><select class="input" id="add-cls">${CLASSES.map(x => `<option value="${x.id}" ${x.id === c ? 'selected' : ''}>${x.name}</option>`).join('')}</select></div>
      </div>
      <div class="pvalue"><div class="label">Valor hoje</div><div class="big num" id="pv">${brl.format(v)}</div><span class="muted" style="font-size:12.5px">atualizado todo dia ${p.type === 'Tesouro' ? 'pelo preço oficial do Tesouro' : 'pela cotação'}</span></div>
      ${p.flag ? `<p class="note" style="margin:0">${ic('info')}<span>${p.flag}, por isso entra em <b>${CLS[p.cls].name}</b>. Você pode trocar a classe.</span></p>` : ''}
    </div>`;
  };
  const rfPreview = () => {
    const r = rfCalc(m.rf);
    return `<div class="preview">
      <div class="ptitle"><span class="tile" style="${tint(r.cls)}">${ic(CLS[r.cls].icon)}</span><span><b>${esc(m.rf.name || 'Título')}</b><span class="muted">${r.label}</span></span></div>
      <div class="pvalue"><div class="label">Valor estimado hoje</div><div class="big num">${brl.format(r.value)}</div><span class="muted" style="font-size:12.5px">${brl.format(m.rf.applied)} aplicados há ${r.years.toFixed(1).replace('.', ',')} anos · ${pct(r.yr * 100)} a.a.</span></div>
      <div class="pills"><span class="pill">${ic('target')}${CLS[r.cls].name}</span><span class="pill">${ic('landmark')}${r.src}</span><span class="pill">${ic('calendar')}vence ${m.rf.mat.split('-').reverse().join('/')}</span></div>
      <p class="note" style="margin:0">${ic('info')}<span>O sistema recalcula esse valor todo dia com as séries do Banco Central. Você nunca precisa atualizar o saldo à mão.</span></p>
    </div>`;
  };
  const draw = () => {
    const t = m.type ? TYPEMAP[m.type] : null;
    const isRf = t && t.mode === 'rf';
    const results = t && !isRf ? CATALOG.filter(a => typeOfCatalog(a) === t.id).filter(a => (a.ticker + ' ' + a.name).toLowerCase().includes(m.q.toLowerCase())) : [];
    const head = t
      ? `<h3 id="add-title"><button class="iconbtn" data-back aria-label="Voltar aos tipos" style="color:var(--accent-strong)">${ic('left')}</button><span class="tile" style="${tint(t.cls)}">${ic(t.icon)}</span>${t.name}</h3>`
      : `<h3 id="add-title"><span class="tile" style="background:var(--accent);color:#fff">${ic('plus')}</span>O que você quer adicionar?</h3>`;
    const body = !t
      ? `<div class="sheet-single"><p class="muted" style="margin:0 0 16px">Escolha o tipo de investimento. Você pode adicionar quantos quiser, um de cada vez.</p>${typeCards('data-type')}</div>`
      : `<div class="sheet-body">
        <div class="sheet-left">${isRf ? `
          <div class="formgrid">
            <div class="field" style="grid-column:1 / -1"><label for="rf-name">Nome do título</label><input class="input" id="rf-name" data-rf="name" value="${esc(m.rf.name)}"></div>

  const close = () => { root.innerHTML = ''; root.onclick = null; root.oninput = null; };
  root.onclick = e => {
    const el = e.target.closest('[data-close],[data-type],[data-back],[data-pick],[data-save]');
    if (!el) { if (e.target.hasAttribute('data-close-bg')) close(); return; }
    m.focusQ = false;
    if (el.hasAttribute('data-close')) return close();
    if (el.dataset.type) { m.type = el.dataset.type; m.pick = null; m.q = ''; m.focusQ = true; return draw(); }
    if (el.hasAttribute('data-back')) { m.type = null; m.pick = null; return draw(); }
    if (el.dataset.pick) { m.pick = CATALOG.find(a => a.ticker === el.dataset.pick); m.qty = null; m.pickCls = null; return draw(); }
    if (el.hasAttribute('data-save')) save();
  };
  root.oninput = e => {
    const el = e.target;
    if (el.id === 'q') { m.q = el.value; m.focusQ = true; return draw(); }
    if (el.id === 'add-qty') { m.qty = Number(el.value) || 0; const p = m.pick; root.querySelector('#pv').textContent = brl.format(m.qty * p.price * (p.cur === 'USD' ? FX : 1)); return; }
    if (el.id === 'add-cls') { m.pickCls = el.value; root.querySelector('#preview').innerHTML = rvPreview(); return; }
    if (el.dataset.rf) {
      const k = el.dataset.rf;
      m.rf[k] = ['rate', 'applied'].includes(k) ? (Number(el.value) || 0) : el.value;
      if (k === 'idx') { m.rf.rate = el.value === 'cdi' ? 105 : el.value === 'pre' ? 12.5 : 6.2; return draw(); }

    }
  };

    if (TYPEMAP[m.type].mode !== 'rf') {
      if (!m.pick) return;
      const p = m.pick, qty = m.qty ?? (p.cls === 'cripto' ? 0.1 : p.type === 'Tesouro' ? 1 : 100), c = m.pickCls || p.cls;
      positions.push({id:nextId++, ticker:p.ticker, name:p.name, cls:c, kind:'rv', qty, price:p.price, cur:p.cur, src:p.src, usdExp:p.usdExp, flag:p.flag});

      const r = rfCalc(m.rf);
      positions.push({id:nextId++, ticker:m.rf.name || 'Título', name:r.label, cls:r.cls, kind:'rf', value:r.value, cur:'BRL', src:r.src});
      toast(`${m.rf.name}: ${brl.format(r.value)} hoje, em ${CLS[r.cls].name}`);
    }
    close(); render();
  };
  m.focusQ = !!m.type;
  draw();
}

        ['scissors', 'Sugestões de onde cortar', 'Com o histórico, a Vera compara cada categoria com a sua média e mostra onde economizar para bater sua meta.']
      ])}
      <p class="note">${ic('shield')}<span><b>Por que pelo Meu Pluggy?</b> O Open Finance só entrega dados a instituições autorizadas pelo Banco Central. O Meu Pluggy é a ponte gratuita: você conecta seus bancos lá e autoriza a leitura. Sua senha do banco nunca passa pela Vera, e o acesso é só de leitura.</span></p>
    </div>
    <section class="card">
      ${ok ? `<h2>${ic('check')}Bancos conectados</h2><p>Seus gastos dos últimos meses já estão chegando.</p>
        <div class="conn"><span class="bank" style="background:#8a05be">Nu</span><span><b>Nubank</b><span class="sub">Cartão e conta</span></span><span class="chip ok" style="margin-left:auto">${ic('check')}ativo</span></div>
        <div class="conn"><span class="bank" style="background:#ec7000">It</span><span><b>Itaú</b><span class="sub">Conta corrente</span></span><span class="chip ok" style="margin-left:auto">${ic('check')}ativo</span></div>`
      : `<h2>${ic('key')}Em 4 passos</h2><p>Uns 15 minutos, uma vez só. O passo a passo detalhado fica sempre em "Conexões".</p>
        <ol class="ministeps">
          <li>Crie sua conta e conecte seus bancos em <a href="https://meu.pluggy.ai" target="_blank" rel="noopener">meu.pluggy.ai</a>.</li>
          <li>Crie a conta de desenvolvedor em <a href="https://dashboard.pluggy.ai" target="_blank" rel="noopener">dashboard.pluggy.ai</a> e uma aplicação com o conector MeuPluggy.</li>
          <li>Na Demo da aplicação, autorize o Meu Pluggy uma vez por banco e copie cada <span class="kbd">Item ID</span>.</li>
          <li>Cole abaixo o <span class="kbd">Client ID</span>, o <span class="kbd">Client Secret</span> e os Item IDs.</li>
        </ol>
        <div class="warnbox">${ic('alert')}<span>O painel da Pluggy dá <b>15 dias de teste</b>. Conecte todos os bancos dentro desse prazo; depois a configuração fica somente leitura.</span></div>
        <form id="onb-pluggy-form" class="grid" style="gap:12px;margin-top:16px">
          <div class="formgrid"><div class="field"><label for="ocid">Client ID</label><input class="input" id="ocid" autocomplete="off" required></div>
          <div class="field"><label for="ocsec">Client Secret</label><input class="input" id="ocsec" type="password" autocomplete="off" required></div></div>
          <div class="field"><label for="oitems">Item IDs, separados por vírgula</label><input class="input" id="oitems" autocomplete="off" required></div>
          <div class="row"><button class="btn primary" type="submit">${ic('plug')}${state.pluggy === 'testing' ? 'Testando…' : 'Testar e conectar'}</button><button class="btn ghost" type="button" data-onb="fill">Preencher exemplo</button></div>
        </form>
        <div style="margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)">
          <div class="field"><label for="onb-ofx">${ic('upload')} Prefere não conectar? Importe um extrato (OFX ou CSV)</label><input class="input" id="onb-ofx" type="file" accept=".ofx,.csv,.txt,.pdf"></div>
          ${imp ? `<p class="note" style="margin:10px 0 0">${ic('check')}<span><b>${esc(state.imported)}</b> lido (protótipo).</span></p>` : ''}
        </div>`}
      <div class="onb-foot"><button class="btn ghost" data-onb="back">${ic('left')}Voltar</button><div class="row">${ok || imp ? `<button class="btn primary" data-onb="next">Continuar</button>` : `<button class="btn primary" data-onb="skip">Pular por enquanto</button>`}</div></div>
    </section>
  </div>`;
  }
  if (s === 3) {
    const total = positions.reduce((t, p) => t + valueBRL(p), 0);
    const spend = state.pluggy === 'ok' ? 'Nubank e Itaú conectados pelo Meu Pluggy' : state.imported ? `Extrato ${esc(state.imported)} importado` : '';
    const row = (ok, icon, t, d, btn) => `<div class="srow"><span class="tile" style="background:${ok ? 'var(--good-soft)' : 'var(--surface-2)'};color:${ok ? 'var(--good)' : 'var(--ink-2)'}">${ic(ok ? 'check' : icon)}</span><span><b>${t}</b><span class="sub">${d}</span></span>${btn || ''}</div>`;
    body = `<div class="done-hero">
      <div class="burst">${ic('check')}</div>
      <h2 class="display">${positions.length || spend ? 'Tudo pronto' : 'Pronto para começar'}</h2>
      <p class="lead" style="margin-inline:auto">${positions.length || spend ? 'Veja o que já está configurado. O que ficou para depois pode ser feito a qualquer momento.' : 'Você pulou as duas etapas, sem problema. A Vera mostra onde começar quando você quiser.'}</p>
      <div class="summary" style="text-align:left">
        ${row(positions.length > 0, 'wallet', positions.length ? `${positions.length} ${positions.length > 1 ? 'ativos cadastrados' : 'ativo cadastrado'} · ${brl.format(total)}` : 'Ativos: para depois', positions.length ? 'A distribuição e a comparação com a meta já estão na Visão geral.' : 'Cadastre quando quiser em "Meus ativos".', positions.length ? '' : `<button class="btn sm" data-onb="goto-1">Cadastrar agora</button>`)}
        ${row(!!spend, 'plug', spend || 'Bancos: para depois', spend ? 'Seus gastos aparecem em "Resumo do mês".' : 'Conecte quando quiser em "Conexões" ou importe um extrato.', spend ? '' : `<button class="btn sm" data-onb="goto-2">Conectar agora</button>`)}
        ${row(true, 'target', 'Carteira-alvo moderada como ponto de partida', 'Uma distribuição inicial para comparar. Ajuste para a sua visão em "Carteira-alvo".', `<button class="btn sm" data-onb="finish-meta">Ajustar</button>`)}
      </div>
      <div class="row" style="justify-content:center;margin-top:24px"><button class="btn primary" data-onb="finish" style="padding:12px 22px;font-size:15px">${ic('pie')}Ir para o painel</button></div>
    </div>`;
  }
  return `<div class="onb" role="dialog" aria-modal="true" aria-label="Configuração inicial">
    <div class="onb-top"><div class="brand"><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 6 L12 19.2 L19.2 6" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8.6" r="2.2" fill="#fff"/></svg></span><div><b>vera</b></div></div>${s > 0 && s < 3 ? prog : '<span></span>'}${s < 3 ? `<button class="btn ghost sm" data-onb="close">Pular configuração ${ic('x')}</button>` : '<span></span>'}</div>
    <div class="onb-body">${body}</div>
  </div>`;
}

const LOGIN_PHOTO = 'vera-login.jpg';
const GOOGLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9h-4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.7V6.6h-4a12 12 0 0 0 0 10.8l4-3z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>';
const FACEBOOK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>';

function renderLogin() {
  const root = document.getElementById('login-root');
  const ub = document.getElementById('userbox');
  ub.innerHTML = state.user ? `<span class="avatar">${state.user.name[0]}</span><span class="meta"><b>${state.user.name}</b><span>via ${state.user.provider}</span></span><button class="logout" data-logout aria-label="Sair" title="Sair">${ic('logout')}</button>` : '';
  if (state.auth) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="login" role="dialog" aria-modal="true" aria-label="Entrar na Vera">
    <div class="login-photo" aria-hidden="true">
      <div class="photo-slot" id="login-photo">${LOGIN_PHOTO ? `<img src="${LOGIN_PHOTO}" alt="">` : `<div class="photo-ph">${ic('sparkle')}<span>Imagem gerada por IA: mulher usando o celular</span></div>`}</div>
      <div class="photo-overlay"></div>
      <div class="photo-mark"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M4.8 6 L12 19.2 L19.2 6" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8.6" r="2.2" fill="#fff"/></svg></div>
    </div>
    <div class="login-side">
      <div class="login-box">
        <div class="brand" style="padding:0"><span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 6 L12 19.2 L19.2 6" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8.6" r="2.2" fill="#fff"/></svg></span><div><b>vera</b></div></div>
        <h2>Entrar</h2>
        <p class="muted" style="margin:0 0 24px">Use sua conta do Google ou do Facebook. Na primeira vez, sua conta é criada automaticamente.</p>
        <div class="grid" style="gap:10px">
          <button class="social" data-login="Google">${GOOGLE}Continuar com Google</button>
          <button class="social fb" data-login="Facebook">${FACEBOOK}Continuar com Facebook</button>
        </div>
        <p class="legal">Ao continuar, você concorda com os Termos de Uso e a Política de Privacidade.</p>
      </div>
      <p class="powered">powered by <b>Revtriever</b></p>
    </div>
  </div>`;
}

function renderOnb() {
  const root = document.getElementById('onb-root');
  if (!state.auth || !state.onb.open) { root.innerHTML = ''; document.body.style.overflow = state.auth ? '' : 'hidden'; return; }
  const sc = root.querySelector('.onb')?.scrollTop || 0;
  const keep = {};
  ['ocid', 'ocsec', 'oitems'].forEach(k => { const el = document.getElementById(k); if (el) keep[k] = el.value; });
  root.innerHTML = onbHTML();
  Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; });
  const o = root.querySelector('.onb'); if (o && state.onb.keepScroll) o.scrollTop = sc;
  state.onb.keepScroll = true;
  document.body.style.overflow = 'hidden';
}

function onbAction(a) {
  const o = state.onb;
  const step = n => { o.step = n; o.keepScroll = false; render(); };
  if (a === 'next') { if (o.step === 1) o.skipped.assets = false; if (o.step === 2) o.skipped.pluggy = false; return step(o.step + 1); }
  if (a === 'back') return step(Math.max(0, o.step - 1));
  if (a === 'skip') { if (o.step === 1) o.skipped.assets = true; if (o.step === 2) o.skipped.pluggy = true; return step(o.step + 1); }
  if (a === 'goto-1') return step(1);
  if (a === 'goto-2') return step(2);
  if (a === 'close' || a === 'finish') { o.open = false; return go(positions.length || !hasSpend() ? 'visao' : 'gastos'); }
  if (a === 'finish-meta') { o.open = false; return go('meta'); }
  if (a === 'restart') { positions = []; state.sample = false; state.pluggy = 'idle'; state.imported = null; o.open = true; o.skipped = {}; return step(0); }
  if (a === 'sample') { positions = SAMPLE.map(p => ({...p})); state.sample = true; o.open = false; toast('Dados de exemplo carregados'); return go('visao'); }
  if (a === 'fill') { document.getElementById('ocid').value = '3f9a1c2e-7b4d-4e21-9a0c-5d2b8e6f1a37'; document.getElementById('ocsec').value = 'exemplo-secreto'; document.getElementById('oitems').value = '8b2c4f10-…, 41de9a77-…'; }
}

function toast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast" role="status">${ic('check')}${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}

const tipEl = document.getElementById('tip');
function tipHTML(el) {
  const d = el.dataset;
  if (d.tip) {
    const {total, rows} = classRows();
    const r = rows.find(x => x.cls === d.tip);
    const c = CLS[d.tip];
    const targetVal = r.target / 100 * total;
    const lines = [];
    if (d.tipKind !== 'meta') lines.push(['Atual', `${pct(r.share)} · ${money(r.value)}`]);
    if (d.tipKind !== 'atual') lines.push(['Meta', `${pct(r.target, 0)} · ${money(targetVal)}`]);
    if (d.tipKind === 'atual') lines.push(['Meta', pct(r.target, 0)]);
    if (d.tipKind === 'meta') lines.push(['Atual', pct(r.share)]);
    const diff = targetVal - r.value;
    const s = Math.abs(r.dev) <= state.tol ? 'Na faixa de tolerância' : diff > 0 ? `Faltam ${money(diff)} para a meta` : `${money(-diff)} acima da meta`;
    return `<div class="t"><i style="background:var(--c-${c.id})"></i>${c.name}</div>${lines.map(([a, b]) => `<div class="l"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="l"><span>Desvio</span><b>${pp(r.dev)}</b></div><div class="s">${s}</div>`;
  }
  if (d.tipAsset) {
    const {total, groups} = assetGroups(state.cls);
    const g = groups.find(x => x.ticker === d.tipAsset);
    if (!g) return '';
    const diff = g.target / 100 * total - g.value;
    return `<div class="t"><i style="background:var(--c-${state.cls})"></i>${esc(g.ticker)}</div><div class="l"><span>Na classe</span><b>${pct(g.share)} · ${money(g.value)}</b></div><div class="l"><span>Meta</span><b>${pct(g.target)}</b></div><div class="s">${Math.abs(g.dev) <= state.tol ? 'Na faixa de tolerância' : diff > 0 ? `Faltam ${money(diff)}` : `${money(-diff)} acima`}</div>`;
  }
  if (d.tipCat) {
    const {t, unc} = catTotals();
    const c = CATMAP[d.tipCat];
    const v = c ? t[c.id] : unc;
    return `<div class="t">${c ? c.name : 'Sem categoria'}</div><div class="l"><span>Setembro</span><b>${brl.format(v)}</b></div>${c && c.avg ? `<div class="l"><span>Sua média</span><b>${brl.format(c.avg)}</b></div><div class="s">${v > c.avg ? `${brl.format(v - c.avg)} acima da média` : `${brl.format(c.avg - v)} abaixo da média`}</div>` : ''}<div class="l"><span>Da renda</span><b>${pct(v / INCOME * 100)}</b></div>`;
  }
  return '';
}
function showTip(el, x, y) {
  const html = tipHTML(el);
  if (!html) return hideTip();
  tipEl.innerHTML = html; tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = x + 14, top = y + 16;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top + h > innerHeight - 8) top = y - h - 12;
  tipEl.style.left = Math.max(8, left) + 'px'; tipEl.style.top = Math.max(8, top) + 'px';
}
function hideTip() { tipEl.hidden = true; }
const TIP_SEL = '[data-tip],[data-tip-asset],[data-tip-cat]';
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest(TIP_SEL); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); });
document.addEventListener('pointerleave', hideTip);
document.addEventListener('scroll', hideTip, true);

function go(screen) {
  state.screen = screen;
  try { history.replaceState(null, '', '#' + screen); } catch (e) {}
  hideTip(); render(); window.scrollTo(0, 0);
}

function render() {
  const a = document.activeElement, id = a && a.id;
  let sel = null; try { sel = a.selectionStart; } catch (e) {}
  document.getElementById('view').innerHTML = gate(state.screen) || (screens[state.screen] || screens.visao)();
  const navKey = state.screen === 'classe' ? 'visao' : state.screen;
  document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.go === navKey ? 'page' : 'false'));
  const u = txs.filter(t => !t.cat).length;
  const c = document.getElementById('unc-count'); c.textContent = u || ''; c.hidden = !u;
  if (id) { const el = document.getElementById(id); if (el && el.closest('#view')) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  renderLogin();
  renderOnb();
}

document.addEventListener('click', e => {
  if (e.target.closest('#modal-root')) return;
  const el = e.target.closest('[data-login],[data-logout],[data-export],[data-onb],[data-add-type],[data-go],[data-set],[data-open-class],[data-step],[data-tol],[data-add],[data-del],[data-aporte-quick],[data-flex],[data-fix],[data-pluggy-demo],[data-pluggy-reset]');
  if (!el) return;
  const d = el.dataset;
  if (d.login) { state.auth = true; state.user = {name:'Lucas', provider:d.login}; toast(`Você entrou com ${d.login}`); return render(); }
  if (el.hasAttribute('data-logout')) { state.auth = false; hideTip(); toast('Você saiu da sua conta'); return render(); }
  if (d.export) { const f = d.export === 'ativos' ? 'vera-carteira.xlsx' : 'vera-transacoes-2026-09.xlsx'; return toast(`${f} gerada (no protótipo o download fica desativado)`); }
  if (d.onb) return onbAction(d.onb);
  if (d.addType) return openAdd(null, {type:d.addType});
  if (d.go) return go(d.go);
  if (d.set) { state[d.set] = d.val; return render(); }
  if (d.openClass) { state.cls = d.openClass; return go('classe'); }
  if (d.step) { classTargets[d.step] = Math.max(0, Math.min(100, (classTargets[d.step] || 0) + Number(d.d))); return render(); }
  if (d.tol) { state.tol = Math.max(0, Math.min(20, state.tol + Number(d.tol))); return render(); }
  if (d.add !== undefined) { hideTip(); return openAdd(d.add || null); }
  if (d.del) { const p = positions.find(x => x.id === Number(d.del)); positions = positions.filter(x => x.id !== Number(d.del)); toast(`${p.ticker} removido`); return render(); }
  if (d.aporteQuick) { state.aporte = Number(d.aporteQuick); return render(); }
  if (d.flex) { CATMAP[d.flex].flex = !CATMAP[d.flex].flex; return render(); }
  if (d.fix) {
    const t = txs.find(x => x.id === Number(d.fix));
    const cat = document.getElementById('fx-' + t.id).value;
    if (!cat) return toast('Escolha uma categoria primeiro');
    const always = document.getElementById('rule-' + t.id).checked;
    const who = t.m.split('·')[1]?.trim();
    let n = 0;
    txs.forEach(x => { if (!x.cat && (x.id === t.id || (always && who && x.m.includes(who)))) { x.cat = cat; x.how = always ? 'sua regra' : 'você'; n++; } });
    toast(always ? `Regra criada: ${who} → ${CATMAP[cat].name} (${n} ${n > 1 ? 'transações' : 'transação'})` : `Categorizada como ${CATMAP[cat].name}`);
    return render();
  }
  if (el.hasAttribute('data-pluggy-demo')) { document.getElementById('cid').value = '3f9a1c2e-7b4d-4e21-9a0c-5d2b8e6f1a37'; document.getElementById('csec').value = 'exemplo-secreto'; document.getElementById('items').value = '8b2c4f10-…, 41de9a77-…'; return; }
  if (el.hasAttribute('data-pluggy-reset')) { state.pluggy = 'idle'; return render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal-root').innerHTML) { document.getElementById('modal-root').innerHTML = ''; document.getElementById('modal-root').onclick = null; return; }
  const row = e.target.closest && e.target.closest('[data-open-class]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); state.cls = row.dataset.openClass; go('classe'); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('#modal-root')) return;
  const d = el.dataset;
  if (d.classTarget) { classTargets[d.classTarget] = Math.max(0, Math.min(100, Number(el.value) || 0)); return render(); }
  if (d.assetTarget) {
    const {groups} = assetGroups(state.cls);
    if (!assetTargets[state.cls]) assetTargets[state.cls] = assetTargetsFor(state.cls, groups.map(g => g.ticker));
    assetTargets[state.cls][d.assetTarget] = Math.max(0, Math.min(100, Number(el.value) || 0));
    return render();
  }
  if (el.hasAttribute('data-tol-input')) { state.tol = Math.max(0, Math.min(20, Number(el.value) || 0)); return render(); }
  if (el.hasAttribute('data-aporte')) { state.aporte = Number(el.value) || 0; return render(); }
  if (el.hasAttribute('data-goal')) { state.goal = Number(el.value); return render(); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('#modal-root')) return;
  if (el.dataset.reclass) { const p = positions.find(x => x.id === Number(el.dataset.reclass)); p.cls = el.value; toast(`${p.ticker} agora em ${CLS[p.cls].name}`); return render(); }
  if (el.dataset.qty) { const p = positions.find(x => x.id === Number(el.dataset.qty)); p.qty = Math.max(0, Number(el.value) || 0); return render(); }
  if (el.dataset.done) { state.done[el.dataset.done] = el.checked; return render(); }
  if ((el.id === 'ofx' || el.id === 'onb-ofx') && el.files[0]) { state.imported = el.files[0].name; return render(); }
});

document.addEventListener('submit', e => {
  if (!['pluggy-form', 'onb-pluggy-form'].includes(e.target.id)) return;
  e.preventDefault();
  state.pluggy = 'testing'; render();
  setTimeout(() => { state.pluggy = 'ok'; render(); toast('2 bancos conectados pelo Meu Pluggy'); }, 900);
});

const start = (location.hash || '').slice(1);
if (screens[start]) state.screen = start;
render();
</script>
